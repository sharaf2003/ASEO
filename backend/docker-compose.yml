services:

  backend:

    build: .

    container_name: aseo_backend

    restart: always


    ports:

      - "8000:8000"


    env_file:

      - .env


    depends_on:

      postgres:

        condition: service_healthy


    healthcheck:

      test:

        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health"
        ]

      interval: 30s

      timeout: 10s

      retries: 3


    networks:

      - aseo_network



  postgres:

    image: pgvector/pgvector:pg16

    container_name: aseo_postgres

    restart: always


    environment:

      POSTGRES_USER: ${DATABASE_USER}

      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

      POSTGRES_DB: ${DATABASE_NAME}


    ports:

      - "5433:5432"


    volumes:

      - aseo_postgres_data:/var/lib/postgresql/data


    healthcheck:

      test:

        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"
        ]

      interval: 10s

      timeout: 5s

      retries: 5


    networks:

      - aseo_network



volumes:

  aseo_postgres_data:





networks:

  aseo_network:

    driver: bridge